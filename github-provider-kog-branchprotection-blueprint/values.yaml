# Default values for github-provider-kog-branchprotection-blueprint.

replicaCount: 1

image:
  #repository: ghcr.io/krateoplatformops-blueprints/github-provider-kog/branchprotection-plugin
  repository: leovice/branchprotection-plugin
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "github-provider-kog-branchprotection-plugin"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# GitHub API base URL.
# Leave empty to use the default (https://api.github.com).
# Override for GitHub Enterprise Server, e.g.: https://my-ghe.corp.com/api/v3
githubApiBaseUrl: ""
