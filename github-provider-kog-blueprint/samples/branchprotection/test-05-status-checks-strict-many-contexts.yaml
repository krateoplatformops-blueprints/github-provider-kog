apiVersion: github.ogen.krateo.io/v1alpha1
kind: BranchProtection
metadata:
  name: test-branchprotection-strict-many-contexts
  namespace: default
  annotations:
    krateo.io/connector-verbose: "true"
spec:
  configurationRef:
    name: my-branchprotection-config
    namespace: default
  owner: krateoplatformops-test
  repo: branchprotection-tester-05
  branch: main
  enforce_admins: true
  required_status_checks:
    strict: true
    contexts:
      - "ci/build"
      - "ci/test"
      - "ci/lint"
      - "security/scan"
      - "coverage/threshold"
  required_pull_request_reviews:
    required_approving_review_count: 2
    dismiss_stale_reviews: true
  restrictions:
    users: []
    teams: []
