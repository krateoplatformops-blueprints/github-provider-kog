# @schema
# type: object
# description: Configuration for the BranchProtection Blueprint dependency.
# @schema
github-provider-kog-branchprotection-blueprint:
  # @schema
  # type: boolean
  # description: Enable the BranchProtection Blueprint dependency.
  # default: true
  # @schema
  enabled: true
  # @schema
  # type: string
  # description: GitHub API base URL. Leave empty for github.com. Set to the full API base URL for GitHub Enterprise Server (e.g. https://ghe.corp.com/api/v3).
  # default: ""
  # @schema
  githubApiBaseUrl: ""

